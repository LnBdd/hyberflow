title: "HYBERFLOW"
description: Open-Source Design of a Hydraulically Actuated Bioprinthead with Flow rate Feedback Control

github_username: LnBdd
remote_theme: just-the-docs/just-the-docs

gems:
  -'jekyll-relative-links'

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

color_scheme: "theme"

callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

relative_links:
  enabled:     true
  collections: false

